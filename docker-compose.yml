# Telescope en un servidor, detrás del nginx que hace de ingress (INGRESS_NETWORK).
#
# Baja las imágenes publicadas por el CI del monorepo (gravadigital/telescope):
# gravadigital/telescope-api y gravadigital/telescope-web. Ninguna trae configuración
# de una instalación: todo sale de .env, al arrancar. Copiar .env.dist a .env.
#
#   docker compose pull && docker compose up -d
#
# Los nombres de proyecto, servicios y volúmenes son los de siempre: cambiarlos
# dejaría la base y los archivos en volúmenes huérfanos.
name: telescope

networks:
  telescope-database:
    name: "telescope-${ENVIRONMENT}-database"
  ingress-network:
    external: true
    name: "${INGRESS_NETWORK}"

volumes:
  telescope-database:
    name: "telescope-${ENVIRONMENT}-database"
  telescope-minio:
    name: "telescope-${ENVIRONMENT}-minio"

services:
  telescope-database:
    image: postgres:15-alpine
    container_name: telescope-${ENVIRONMENT}-database
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - telescope-database:/var/lib/postgresql/data
    networks:
      - telescope-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 3

  telescope-api:
    # dev sigue la punta de la rama dev (se republica en cada push); un número (0.2.0)
    # fija un release. Las dos imágenes llevan siempre el mismo número.
    image: gravadigital/telescope-api:${IMAGES_TAG:-dev}
    container_name: telescope-${ENVIRONMENT}-api
    restart: always
    environment:
      - VIRTUAL_HOST=api.${DOMAIN}
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=api.${DOMAIN}
      - DB_HOST=telescope-database
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - PORT=8080
      - GIN_MODE=${GIN_MODE:-release}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      # Sin esto la api arranca igual y firma los tokens con un secreto que está en el
      # código público: cualquiera podría fabricar un token válido. Se exige acá.
      - "JWT_SECRET=${JWT_SECRET:?falta JWT_SECRET en .env, generalo con openssl rand -base64 32}"
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-https://${DOMAIN}}
      - FRONTEND_URL=https://${DOMAIN}
      - STORAGE_PROVIDER=minio
      - MINIO_ENDPOINT=telescope-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-telescopio}
      - MINIO_USE_SSL=false
      - MINIO_REGION=us-east-1
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Telescopio}
    networks:
      - ingress-network
      - telescope-database
    depends_on:
      telescope-database:
        condition: service_healthy
      telescope-minio-init:
        condition: service_completed_successfully

  # La web lee su configuración al arrancar: el contenedor la escribe en config.js.
  # API_URL es la URL de la api como la ve el navegador, no un nombre interno.
  telescope-web:
    image: gravadigital/telescope-web:${IMAGES_TAG:-dev}
    container_name: telescope-${ENVIRONMENT}-web
    restart: always
    environment:
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${DOMAIN}
      - API_URL=${API_URL:-https://api.${DOMAIN}}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    networks:
      - ingress-network
    depends_on:
      - telescope-api

  telescope-minio:
    # MinIO dejó de publicar imágenes (Docker Hub y quay.io); pgsty mantiene builds del
    # mismo código. Tag fijo, igual al del monorepo.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: telescope-${ENVIRONMENT}-minio
    restart: always
    command: server /data --console-address ":9001"
    # Sin ports: la consola la publica el ingress en minio.${DOMAIN}.
    # Las credenciales root son distintas de las de la api (MINIO_ACCESS_KEY). Con datos
    # ya guardados no hay que cambiarlas: MinIO no abriría su configuración con otras.
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - VIRTUAL_HOST=minio.${DOMAIN}
      - VIRTUAL_PORT=9001
      - LETSENCRYPT_HOST=minio.${DOMAIN}
    volumes:
      - telescope-minio:/data
    networks:
      - telescope-database
      - ingress-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Crea el bucket y termina: la api no lo crea, y sin él la primera subida falla con
  # NoSuchBucket. Reintenta porque que minio esté healthy no garantiza que ya se lo
  # resuelva por nombre desde otro contenedor.
  telescope-minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: telescope-${ENVIRONMENT}-minio-init
    restart: "no"
    # Con las credenciales root: crear un bucket es una operación de administrador.
    environment:
      - MINIO_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-telescopio}
    entrypoint: >
      sh -c '
      for i in $$(seq 1 30); do
        mc alias set local http://telescope-minio:9000 "$$MINIO_USER" "$$MINIO_PASSWORD" >/dev/null 2>&1 && break;
        echo "esperando a minio ($$i/30)...";
        sleep 2;
      done;
      mc alias set local http://telescope-minio:9000 "$$MINIO_USER" "$$MINIO_PASSWORD" &&
      mc mb --ignore-existing "local/$$MINIO_BUCKET"
      '
    depends_on:
      telescope-minio:
        condition: service_healthy
    networks:
      - telescope-database

  # Opcional: docker compose --profile tools up -d telescope-pgadmin
  # Sin ports: lo publica el ingress en pgadmin.${DOMAIN}.
  telescope-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: telescope-${ENVIRONMENT}-pgadmin
    restart: always
    environment:
      - VIRTUAL_HOST=pgadmin.${DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=pgadmin.${DOMAIN}
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
    networks:
      - ingress-network
      - telescope-database
    profiles:
      - tools
