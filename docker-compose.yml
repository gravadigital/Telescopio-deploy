# Telescope en un servidor, detrás del nginx que hace de ingress (INGRESS_NETWORK).
#
# Baja las imágenes publicadas por el CI del monorepo (gravadigital/telescope):
# gravadigital/telescope-api y gravadigital/telescope-web. Ninguna trae configuración
# de una instalación: todo sale de .env, al arrancar. Copiar .env.dist a .env.
#
#   docker compose pull && docker compose up -d
#
# Los nombres de proyecto, servicios y volúmenes son los de siempre: cambiarlos
# dejaría la base y los archivos en volúmenes huérfanos. Excepción: telescope-storage
# reemplazó a telescope-minio sin migrar datos; el volumen telescope-<env>-minio que
# quede en un servidor ya no lo usa nadie.
name: telescope

networks:
  telescope-database:
    name: "telescope-${ENVIRONMENT}-database"
  ingress-network:
    external: true
    name: "${INGRESS_NETWORK}"

volumes:
  telescope-database:
    name: "telescope-${ENVIRONMENT}-database"
  telescope-storage-meta:
    name: "telescope-${ENVIRONMENT}-storage-meta"
  telescope-storage-data:
    name: "telescope-${ENVIRONMENT}-storage-data"

services:
  telescope-database:
    image: postgres:15-alpine
    container_name: telescope-${ENVIRONMENT}-database
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - telescope-database:/var/lib/postgresql/data
    networks:
      - telescope-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 3

  telescope-api:
    # dev sigue la punta de la rama dev (se republica en cada push); un número (0.2.0)
    # fija un release. Las dos imágenes llevan siempre el mismo número.
    image: gravadigital/telescope-api:${IMAGES_TAG:-dev}
    container_name: telescope-${ENVIRONMENT}-api
    restart: always
    environment:
      - VIRTUAL_HOST=api.${DOMAIN}
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=api.${DOMAIN}
      - DB_HOST=telescope-database
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - PORT=8080
      - GIN_MODE=${GIN_MODE:-release}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      # Sin esto la api arranca igual y firma los tokens con un secreto que está en el
      # código público: cualquiera podría fabricar un token válido. Se exige acá.
      - "JWT_SECRET=${JWT_SECRET:?falta JWT_SECRET en .env, generalo con openssl rand -base64 32}"
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-https://${DOMAIN}}
      - FRONTEND_URL=https://${DOMAIN}
      - STORAGE_PROVIDER=s3
      - S3_ENDPOINT=http://telescope-storage:3900
      - S3_REGION=garage
      - S3_BUCKET=${S3_BUCKET:-telescope}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Telescopio}
    networks:
      - ingress-network
      - telescope-database
    depends_on:
      telescope-database:
        condition: service_healthy
      telescope-storage:
        condition: service_healthy

  # La web lee su configuración al arrancar: el contenedor la escribe en config.js.
  # API_URL es la URL de la api como la ve el navegador, no un nombre interno.
  telescope-web:
    image: gravadigital/telescope-web:${IMAGES_TAG:-dev}
    container_name: telescope-${ENVIRONMENT}-web
    restart: always
    environment:
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${DOMAIN}
      - API_URL=${API_URL:-https://api.${DOMAIN}}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    networks:
      - ingress-network
    depends_on:
      - telescope-api

  # Almacenamiento S3 de las propuestas. Corre Garage, pero el servicio se llama storage:
  # es el host que ve la api y no cambia si cambia la herramienta.
  #
  # Un solo nodo: --single-node arma el layout y --default-bucket crea la clave de la api y
  # el bucket al arrancar, en forma idempotente. La api no crea el bucket (en Garage
  # quedaría con alias local): lo verifica al arrancar.
  #
  # Sin ports, sin subdominio y fuera del ingress: nadie llega desde internet. La api le
  # habla por la red interna y las descargas pasan por ella. Si algún día hace falta
  # publicarlo (links prefirmados), va en storage.${DOMAIN} y al puerto 3900, nunca al 3903.
  #
  # Con datos guardados no hay que cambiar S3_ACCESS_KEY_ID ni S3_SECRET_ACCESS_KEY:
  # Garage no arranca si el secreto no coincide con la clave que ya existe.
  telescope-storage:
    image: dxflrs/garage:v2.4.1
    container_name: telescope-${ENVIRONMENT}-storage
    restart: always
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      - "GARAGE_RPC_SECRET=${STORAGE_RPC_SECRET:?falta STORAGE_RPC_SECRET en .env, generalo con openssl rand -hex 32}"
      - "GARAGE_ADMIN_TOKEN=${STORAGE_ADMIN_TOKEN:?falta STORAGE_ADMIN_TOKEN en .env, generalo con openssl rand -base64 32}"
      - "GARAGE_DEFAULT_ACCESS_KEY=${S3_ACCESS_KEY_ID:?falta S3_ACCESS_KEY_ID en .env}"
      - "GARAGE_DEFAULT_SECRET_KEY=${S3_SECRET_ACCESS_KEY:?falta S3_SECRET_ACCESS_KEY en .env}"
      - GARAGE_DEFAULT_BUCKET=${S3_BUCKET:-telescope}
    volumes:
      - ./storage/garage.toml:/etc/garage.toml:ro
      - telescope-storage-meta:/var/lib/garage/meta
      - telescope-storage-data:/var/lib/garage/data
    networks:
      - telescope-database
    healthcheck:
      # La imagen no trae shell, curl ni wget: el healthcheck usa el propio binario.
      test: ["CMD", "/garage", "health", "-q"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Opcional: docker compose --profile tools up -d telescope-pgadmin
  # Sin ports: lo publica el ingress en pgadmin.${DOMAIN}.
  telescope-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: telescope-${ENVIRONMENT}-pgadmin
    restart: always
    environment:
      - VIRTUAL_HOST=pgadmin.${DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=pgadmin.${DOMAIN}
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
    networks:
      - ingress-network
      - telescope-database
    profiles:
      - tools
